<body>

<!-- HERO -->
<header class="hero">

    </div>
</header>

<!-- MAIN -->
<main class="main">
    <!-- SEARCH -->
    <div class="search-wrap">
        <p>Revisa todo el catálogo que tenemos para ti</p>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Encuentra el disco que estás buscando" autocomplete="off">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
    </div>

    <!-- GENRES -->
    <div class="genres-wrap">
        <button class="genres-toggle" id="genresToggle">
            <span id="genresToggleLabel">Novedades</span>
            <svg class="genres-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="genres" id="genreList"></div>
    </div>

    <!-- COUNTER -->
    <p class="count-bar" id="countBar">Mostrando <span id="countNum">0</span> <span id="countLabel">vinilos</span></p>

    <!-- GRID -->
    <div class="grid" id="catalog"></div>

    <!-- INFINITE SCROLL SENTINEL -->
    <div id="sentinel" style="display:none;">
        <div class="spinner"></div>
    </div>
</main>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal" id="modalBox">
        <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
        <div class="modal-cover" id="modalCover"></div>
        <div class="modal-info">
            <p class="modal-artist" id="modalArtist"></p>
            <h2 class="modal-album" id="modalAlbum"></h2>
            <span class="modal-version" id="modalVersion"></span>
            <p class="modal-price" id="modalPrice"></p>
            <p class="modal-edition" id="modalEdition"></p>
            <div class="modal-genres" id="modalGenres"></div>
            <div class="modal-actions" id="modalActions"></div>
